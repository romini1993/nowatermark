<title>VidDown</title>

<!-- PWA Manifest inline -->
<script>
const manifestData = {
  name: "VidDown - No Watermark",
  short_name: "VidDown",
  description: "Download TikTok, IG, FB tanpa watermark",
  start_url: "./",
  display: "standalone",
  background_color: "#0a0a0a",
  theme_color: "#0a0a0a",
  orientation: "portrait",
  icons: [
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%230a0a0a'/%3E%3Ctext x='96' y='130' font-size='100' text-anchor='middle'%3E%E2%AC%87%EF%B8%8F%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" },
    { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%230a0a0a'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle'%3E%E2%AC%87%EF%B8%8F%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
  ]
};
const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/manifest+json'});
const manifestUrl = URL.createObjectURL(blob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestUrl;
document.head.appendChild(link);
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #666;
    --accent: #e8f542;
    --accent-dim: rgba(232,245,66,0.12);
    --red: #ff4d4d;
    --green: #4dff91;
    --green-dim: rgba(77,255,145,0.1);
    --red-dim: rgba(255,77,77,0.1);
    --radius: 14px;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px 40px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    padding: 52px 0 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .logo {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -1px;
    color: var(--text);
  }

  .logo span {
    color: var(--accent);
  }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ── PLATFORM TABS ── */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 20px;
    background: var(--surface);
    padding: 5px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  .tab {
    padding: 10px 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .tab:active { transform: scale(0.96); }

  .tab.active {
    background: var(--accent);
    color: #0a0a0a;
    font-weight: 600;
  }

  .tab-icon { font-size: 15px; }

  /* ── INPUT AREA ── */
  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  .input-card:focus-within {
    border-color: var(--accent);
  }

  .input-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .url-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
    min-width: 0;
  }

  .url-input::placeholder { color: var(--muted); }
  .url-input:focus { border-color: #444; }

  .paste-btn {
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }

  .paste-btn:active { transform: scale(0.92); background: var(--border); }

  /* ── DOWNLOAD BTN ── */
  .dl-btn {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #0a0a0a;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    letter-spacing: -0.2px;
    margin-bottom: 16px;
  }

  .dl-btn:active:not(:disabled) { transform: scale(0.98); opacity: 0.9; }
  .dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── RESULT ── */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: none;
    animation: slideUp 0.25s ease;
    margin-bottom: 16px;
  }

  .result-card.visible { display: block; }
  .result-card.err { border-color: var(--red); background: var(--red-dim); }
  .result-card.ok { border-color: #333; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .result-author {
    font-size: 13px;
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 700;
  }

  .result-title {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-links { display: flex; flex-direction: column; gap: 8px; }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 15px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn:active { background: var(--border); transform: scale(0.98); }

  .link-btn .link-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .link-btn .link-label { flex: 1; }

  .link-btn .link-arrow {
    color: var(--muted);
    font-size: 16px;
  }

  .link-btn.primary {
    background: var(--green-dim);
    border-color: rgba(77,255,145,0.25);
    color: var(--green);
  }

  .err-msg {
    font-size: 13px;
    color: var(--red);
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
  }

  /* ── LOADING ── */
  .loading-wrap {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 32px 0;
  }

  .loading-wrap.visible { display: flex; }

  .loader {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* ── INSTALL BANNER ── */
  .install-banner {
    display: none;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    align-items: center;
    gap: 12px;
    animation: slideUp 0.3s ease;
  }

  .install-banner.visible { display: flex; }

  .install-banner p {
    flex: 1;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }

  .install-banner strong { color: var(--text); }

  .install-go {
    padding: 9px 16px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #0a0a0a;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  footer {
    margin-top: auto;
    padding-top: 24px;
    text-align: center;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--border);
    letter-spacing: 0.5px;
    line-height: 1.8;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">vid<span>.</span>down</div>
    <div class="badge">No Watermark</div>
  </header>

  <div id="installBanner" class="install-banner">
    <p><strong>Install ke HP lo!</strong><br>Biar gampang dibuka kapan aja</p>
    <button class="install-go" onclick="installPWA()">Install</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-p="tiktok" onclick="setP(this)">
      <span class="tab-icon">🎵</span> TikTok
    </button>
    <button class="tab" data-p="instagram" onclick="setP(this)">
      <span class="tab-icon">📷</span> Insta
    </button>
    <button class="tab" data-p="facebook" onclick="setP(this)">
      <span class="tab-icon">👍</span> FB
    </button>
  </div>

  <div class="input-card">
    <span class="input-label">Link Video</span>
    <div class="input-row">
      <input class="url-input" type="url" id="vurl"
        placeholder="https://www.tiktok.com/..."
        autocomplete="off" autocorrect="off" spellcheck="false"
      />
      <button class="paste-btn" onclick="pasteClipboard()" title="Paste">📋</button>
    </div>
  </div>

  <button class="dl-btn" id="gobtn" onclick="doFetch()">
    ⬇ Download Sekarang
  </button>

  <div class="loading-wrap" id="loadWrap">
    <div class="loader"></div>
    <div class="loading-text">FETCHING LINK...</div>
  </div>

  <div class="result-card" id="resCard"></div>

  <footer>
    hanya untuk video milik sendiri &nbsp;·&nbsp; hormati kreator lain<br>
    vid.down v2.0 &nbsp;·&nbsp; powered by tiklydown api
  </footer>
</div>

<script>
let platform = 'tiktok';
let deferredPrompt = null;

/* ── PWA Install ── */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('visible');
});

function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    document.getElementById('installBanner').classList.remove('visible');
    deferredPrompt = null;
  });
}

/* ── Platform switch ── */
function setP(btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  platform = btn.dataset.p;
  const ph = {
    tiktok: 'https://www.tiktok.com/@user/video/...',
    instagram: 'https://www.instagram.com/reel/...',
    facebook: 'https://www.facebook.com/watch/...'
  };
  document.getElementById('vurl').placeholder = ph[platform];
  hide();
}

/* ── Paste from clipboard ── */
async function pasteClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('vurl').value = text;
  } catch(e) {
    document.getElementById('vurl').focus();
  }
}

/* ── UI helpers ── */
function hide() {
  document.getElementById('resCard').classList.remove('visible');
  document.getElementById('resCard').className = 'result-card';
  document.getElementById('loadWrap').classList.remove('visible');
}

function showLoad() {
  document.getElementById('loadWrap').classList.add('visible');
  document.getElementById('resCard').classList.remove('visible');
}

function hideLoad() {
  document.getElementById('loadWrap').classList.remove('visible');
}

function showErr(msg) {
  const c = document.getElementById('resCard');
  c.className = 'result-card err visible';
  c.innerHTML = `<div class="err-msg"><span>⚠️</span><span>${msg}</span></div>`;
}

function showOk(html, meta) {
  const c = document.getElementById('resCard');
  c.className = 'result-card ok visible';
  let metaHtml = '';
  if (meta) {
    metaHtml = `<div class="result-meta">
      ${meta.author ? `<div class="result-author">@${esc(meta.author)}</div>` : ''}
      ${meta.title ? `<div class="result-title">${esc(meta.title)}</div>` : ''}
    </div>`;
  }
  c.innerHTML = metaHtml + `<div class="result-links">${html}</div>`;
}

function linkBtn(href, label, icon, primary) {
  return `<a class="link-btn${primary?' primary':''}" href="${esc(href)}" target="_blank" rel="noopener">
    <span class="link-icon">${icon}</span>
    <span class="link-label">${label}</span>
    <span class="link-arrow">↗</span>
  </a>`;
}

function esc(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ── Main fetch ── */
async function doFetch() {
  const url = document.getElementById('vurl').value.trim();
  if (!url) { showErr('Paste link video dulu bro!'); return; }

  const btn = document.getElementById('gobtn');
  btn.disabled = true;
  showLoad();

  try {
    if (platform === 'tiktok') await fetchTikTok(url);
    else if (platform === 'instagram') await fetchIG(url);
    else await fetchFB(url);
  } catch(e) {
    showErr('Gagal: ' + e.message + '<br><small style="opacity:0.7">Cek link-nya, atau coba lagi.</small>');
  }

  hideLoad();
  btn.disabled = false;
}

/* ── TikTok ── */
async function fetchTikTok(url) {
  const res = await fetch('https://api.tiklydown.eu.org/api/download/v3?url=' + encodeURIComponent(url));
  if (!res.ok) throw new Error('API error ' + res.status);
  const d = await res.json();
  if (!d || d.code !== 0) throw new Error(d?.msg || 'Data tidak ditemukan');

  const v = d.data;
  let links = '';
  if (v.play)   links += linkBtn(v.play,   'Video tanpa watermark ✨', '🎬', true);
  if (v.wmplay) links += linkBtn(v.wmplay, 'Video dengan watermark',   '🎵');
  if (v.music)  links += linkBtn(v.music,  'Audio saja (MP3)',         '🎧');

  showOk(links, {
    author: v.author?.nickname,
    title:  v.title
  });
}

/* ── Instagram ── */
async function fetchIG(url) {
  /* Coba via cobadl / snapinsta public proxy */
  const proxyUrl = 'https://snapinsta.app/api/ajaxSearch';
  let links = '';

  try {
    const form = new FormData();
    form.append('url', url);
    form.append('lang', 'id');
    const res = await fetch(proxyUrl, { method: 'POST', body: form });
    const d = await res.json();
    if (d?.data) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(d.data, 'text/html');
      doc.querySelectorAll('a[href*=".mp4"], a[href*="download"]').forEach(a => {
        links += linkBtn(a.href, 'Download Video', '🎬', !links);
      });
    }
  } catch(_) {}

  if (!links) {
    /* Fallback: redirect ke snapinsta */
    links = linkBtn(
      'https://snapinsta.app/?url=' + encodeURIComponent(url),
      'Buka di SnapInsta.app',
      '🔗', true
    ) + linkBtn(
      'https://igram.world/?url=' + encodeURIComponent(url),
      'Buka di iGram.world',
      '🔗'
    );
    showOk(links);
    return;
  }

  showOk(links);
}

/* ── Facebook ── */
async function fetchFB(url) {
  /* Coba via fdown/snapsave public endpoint */
  let links = '';

  try {
    const res = await fetch('https://fdown.net/download.php?URLz=' + encodeURIComponent(url));
    const text = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const hdLink = doc.querySelector('#hdlink');
    const sdLink = doc.querySelector('#sdlink');
    if (hdLink?.href) links += linkBtn(hdLink.href, 'Kualitas HD', '🎬', true);
    if (sdLink?.href) links += linkBtn(sdLink.href, 'Kualitas SD', '📱');
  } catch(_) {}

  if (!links) {
    links = linkBtn(
      'https://fdown.net/?url=' + encodeURIComponent(url),
      'Buka di FDown.net',
      '🔗', true
    ) + linkBtn(
      'https://getfvid.com/?url=' + encodeURIComponent(url),
      'Buka di GetFVid.com',
      '🔗'
    );
  }

  showOk(links);
}

/* ── Enter key ── */
document.getElementById('vurl').addEventListener('keydown', e => {
  if (e.key === 'Enter') doFetch();
});

/* ── Service Worker ── */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'viddown-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      if (e.request.url.includes('api.tiklydown')) return;
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
          if (res.ok) {
            const clone = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
          }
          return res;
        }))
      );
    });
  `;
  const swBlob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
</body>
</html>
