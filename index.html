<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Download video TikTok, Instagram, Facebook tanpa watermark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VidDown">
<title>VidDown</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --border: #2a2a2a;
    --text: #f0f0f0; --muted: #7a7a7a; --accent: #e8f542;
    --red: #ff4d4d; --green: #4dff91;
    --green-dim: rgba(77,255,145,0.1); --red-dim: rgba(255,77,77,0.1);
    --radius: 14px;
    --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  }
  .app {
    max-width: 480px; margin: 0 auto; padding: 0 20px 40px; width: 100%;
    flex: 1; display: flex; flex-direction: column;
  }
  header { padding: 52px 0 32px; display: flex; align-items: flex-end; justify-content: space-between; }
  .logo { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: -1px; }
  .logo span { color: var(--accent); }
  .badge {
    font-family: var(--mono); font-size: 10px; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 100px; color: var(--muted);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 20px;
    background: var(--surface); padding: 5px; border-radius: var(--radius); border: 1px solid var(--border);
  }
  .tab {
    padding: 10px 6px; border: none; background: transparent; color: var(--muted);
    border-radius: 10px; cursor: pointer; font-family: var(--sans); font-size: 13px; font-weight: 500;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .tab:active { transform: scale(0.96); }
  .tab.active { background: var(--accent); color: #0a0a0a; font-weight: 600; }
  .input-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; transition: border-color 0.2s;
  }
  .input-card:focus-within { border-color: var(--accent); }
  .input-label {
    font-size: 11px; font-family: var(--mono); color: var(--muted); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 10px; display: block;
  }
  .input-row { display: flex; gap: 8px; align-items: center; }
  .url-input {
    flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-family: var(--mono); font-size: 16px; outline: none; transition: border-color 0.2s;
  }
  .url-input::placeholder { color: var(--muted); font-size: 12px; }
  .url-input:focus { border-color: #444; }
  .paste-btn {
    padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--muted); font-size: 18px; cursor: pointer;
    transition: all 0.15s; flex-shrink: 0; line-height: 1;
  }
  .paste-btn:active { transform: scale(0.92); background: var(--border); }
  .dl-btn {
    width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: var(--radius);
    color: #0a0a0a; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s; margin-bottom: 16px;
  }
  .dl-btn:active:not(:disabled) { transform: scale(0.98); opacity: 0.9; }
  .dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .result-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: none; animation: slideUp 0.25s ease; margin-bottom: 16px;
  }
  .result-card.visible { display: block; }
  .result-card.err { border-color: var(--red); background: var(--red-dim); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .result-meta {
    display: flex; flex-direction: column; gap: 3px; margin-bottom: 14px;
    padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  .result-author { font-size: 13px; color: var(--accent); font-family: var(--mono); font-weight: 700; }
  .result-title { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .result-links { display: flex; flex-direction: column; gap: 8px; }
  .link-btn {
    display: flex; align-items: center; gap: 10px; padding: 13px 15px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .link-btn:active { background: var(--border); transform: scale(0.98); }
  .link-btn.busy { opacity: 0.5; pointer-events: none; }
  .link-icon { font-size: 20px; flex-shrink: 0; }
  .link-label { flex: 1; }
  .link-arrow { color: var(--muted); font-size: 16px; }
  .link-btn.primary { background: var(--green-dim); border-color: rgba(77,255,145,0.25); color: var(--green); }
  .err-msg { font-size: 13px; color: var(--red); display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; }
  .loading-wrap { display: none; flex-direction: column; align-items: center; gap: 14px; padding: 32px 0; }
  .loading-wrap.visible { display: flex; }
  .loader {
    width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .install-banner {
    display: none; background: var(--surface); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
    align-items: center; gap: 12px; animation: slideUp 0.3s ease;
  }
  .install-banner.visible { display: flex; }
  .install-banner p { flex: 1; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .install-banner strong { color: var(--text); }
  .install-go {
    padding: 9px 16px; background: var(--accent); border: none; border-radius: 8px;
    color: #0a0a0a; font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .install-x { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; }
  footer {
    margin-top: auto; padding-top: 24px; text-align: center; font-family: var(--mono);
    font-size: 10px; color: #444; letter-spacing: 0.5px; line-height: 1.8;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">vid<span>.</span>down</div>
    <div class="badge">No Watermark</div>
  </header>

  <div class="install-banner" id="installBanner">
    <p id="installText"><strong>Install ke HP lo</strong><br>Biar bisa dibuka langsung dari layar utama</p>
    <button class="install-go" id="installGo">Install</button>
    <button class="install-x" id="installX" aria-label="Tutup">✕</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-p="tiktok">🎵 TikTok</button>
    <button class="tab" data-p="instagram">📷 Insta</button>
    <button class="tab" data-p="facebook">👍 FB</button>
  </div>

  <div class="input-card">
    <span class="input-label">Link video</span>
    <div class="input-row">
      <input class="url-input" type="url" id="vurl" placeholder="https://www.tiktok.com/@user/video/..."
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="paste-btn" id="pasteBtn" title="Tempel dari clipboard">📋</button>
    </div>
  </div>

  <button class="dl-btn" id="gobtn">⬇ Download sekarang</button>

  <div class="loading-wrap" id="loadWrap">
    <div class="loader"></div>
    <div class="loading-text">MENGAMBIL LINK...</div>
  </div>

  <div class="result-card" id="resCard"></div>

  <footer>
    hanya untuk video milik sendiri · hormati kreator lain<br>
    vid.down v3.0
  </footer>
</div>

<script>
/* ============ KONFIGURASI (opsional) ============
   Kalau nanti lo punya backend sendiri (yt-dlp / Cloudflare Worker),
   isi URL-nya di sini. Backend harus balas JSON:
   { "url": "https://...mp4", "title": "...", "author": "..." }
   dan menerima query ?url=LINK_VIDEO
   Kosongin = pakai mode bawaan (TikTok via tikwm, IG/FB via situs downloader). */
const BACKEND = '';

let platform = 'tiktok';
const $ = id => document.getElementById(id);
const PH = {
  tiktok: 'https://www.tiktok.com/@user/video/...',
  instagram: 'https://www.instagram.com/reel/...',
  facebook: 'https://www.facebook.com/watch/...'
};

/* ---------- helper ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function detectPlatform(url) {
  if (/tiktok\.com/i.test(url)) return 'tiktok';
  if (/instagram\.com|instagr\.am/i.test(url)) return 'instagram';
  if (/facebook\.com|fb\.watch|fb\.com/i.test(url)) return 'facebook';
  return null;
}

function setPlatform(p) {
  platform = p;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.p === p));
  $('vurl').placeholder = PH[p];
}

function resetUI() {
  $('resCard').className = 'result-card';
  $('resCard').innerHTML = '';
  $('loadWrap').classList.remove('visible');
}

function showErr(msg) {
  const c = $('resCard');
  c.className = 'result-card err visible';
  c.innerHTML = '<div class="err-msg"><span>⚠️</span><span>' + msg + '</span></div>';
}

function showOk(html, meta, note) {
  const c = $('resCard');
  c.className = 'result-card visible';
  let m = '';
  if (meta && (meta.author || meta.title)) {
    m = '<div class="result-meta">' +
      (meta.author ? '<div class="result-author">@' + esc(meta.author) + '</div>' : '') +
      (meta.title ? '<div class="result-title">' + esc(meta.title) + '</div>' : '') +
      '</div>';
  }
  c.innerHTML = m + (note ? '<div class="note">' + note + '</div>' : '') + '<div class="result-links">' + html + '</div>';
}

/* dl = nama file → klik akan coba simpan langsung, kalau gagal buka di tab baru */
function linkBtn(href, label, icon, primary, dl) {
  return '<a class="link-btn' + (primary ? ' primary' : '') + '" href="' + esc(href) + '"' +
    (dl ? ' data-dl="' + esc(dl) + '"' : '') +
    ' target="_blank" rel="noopener noreferrer">' +
    '<span class="link-icon">' + icon + '</span>' +
    '<span class="link-label">' + label + '</span>' +
    '<span class="link-arrow">' + (dl ? '⬇' : '↗') + '</span></a>';
}

async function saveFile(href, name) {
  const r = await fetch(href);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const blob = await r.blob();
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}

/* klik tombol download → simpan file; kalau diblok browser, buka di tab baru */
$('resCard').addEventListener('click', async e => {
  const a = e.target.closest('a[data-dl]');
  if (!a) return;
  e.preventDefault();
  a.classList.add('busy');
  try {
    await saveFile(a.href, a.dataset.dl);
  } catch (_) {
    window.open(a.href, '_blank', 'noopener');
  }
  a.classList.remove('busy');
});

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (_) { return false; }
}

async function getJSON(url, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const r = await fetch(url, Object.assign({ signal: ctrl.signal }, opts || {}));
    if (!r.ok) throw new Error('Server balas ' + r.status);
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Server kelamaan merespon');
    if (e instanceof TypeError) throw new Error('Tidak bisa terhubung ke server (koneksi / diblokir)');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- backend sendiri (opsional) ---------- */
async function fetchBackend(url) {
  const d = await getJSON(BACKEND + (BACKEND.includes('?') ? '&' : '?') + 'url=' + encodeURIComponent(url));
  if (!d || !d.url) throw new Error((d && (d.error || d.msg)) || 'Video tidak ditemukan');
  showOk(linkBtn(d.url, 'Download video', '🎬', true, 'viddown-' + Date.now() + '.mp4'),
    { author: d.author, title: d.title });
}

/* ---------- TikTok (tikwm) ---------- */
async function fetchTikTok(url) {
  const d = await getJSON('https://www.tikwm.com/api/?hd=1&url=' + encodeURIComponent(url));
  if (!d || d.code !== 0 || !d.data) throw new Error((d && d.msg) || 'Video tidak ditemukan');
  const v = d.data;
  const abs = u => u && (/^https?:/.test(u) ? u : 'https://www.tikwm.com' + u);
  const id = v.id || Date.now();
  let links = '';
  const clean = abs(v.hdplay || v.play);
  if (clean)   links += linkBtn(clean, 'Video tanpa watermark ✨', '🎬', true, 'tiktok-' + id + '.mp4');
  if (v.wmplay) links += linkBtn(abs(v.wmplay), 'Video dengan watermark', '🎵', false, 'tiktok-wm-' + id + '.mp4');
  if (v.music) links += linkBtn(abs(v.music), 'Audio saja (MP3)', '🎧', false, 'tiktok-' + id + '.mp3');
  if (!links) throw new Error('Link download tidak tersedia untuk video ini');
  showOk(links, { author: v.author && (v.author.unique_id || v.author.nickname), title: v.title });
}

/* ---------- Instagram & Facebook ----------
   Browser tidak bisa ambil langsung dari situs downloader (diblok CORS).
   Jadi: link otomatis disalin, lalu lo buka situs downloader dan tinggal tempel. */
async function fetchViaSites(url, sites) {
  const copied = await copyText(url);
  const links = sites.map((s, i) => linkBtn(s.href, 'Buka ' + s.name, '🔗', i === 0)).join('');
  showOk(links, null,
    (copied ? '✅ Link sudah disalin. ' : '') +
    'Buka salah satu situs di bawah, lalu tempel link-nya (tahan lama → Tempel) dan tekan download.');
}

/* ---------- main ---------- */
async function doFetch() {
  const url = $('vurl').value.trim();
  if (!url) { showErr('Tempel link video dulu ya.'); return; }
  if (!/^https?:\/\//i.test(url)) { showErr('Link harus diawali <b>https://</b>'); return; }

  const detected = detectPlatform(url);
  if (detected && detected !== platform) setPlatform(detected);

  const btn = $('gobtn');
  btn.disabled = true;
  resetUI();
  $('loadWrap').classList.add('visible');

  try {
    if (BACKEND) await fetchBackend(url);
    else if (platform === 'tiktok') await fetchTikTok(url);
    else if (platform === 'instagram') await fetchViaSites(url, [
      { name: 'SnapInsta', href: 'https://snapinsta.app/' },
      { name: 'iGram', href: 'https://igram.world/' }
    ]);
    else await fetchViaSites(url, [
      { name: 'FDown', href: 'https://fdown.net/' },
      { name: 'GetFVid', href: 'https://getfvid.com/' }
    ]);
  } catch (e) {
    showErr('Gagal: ' + esc(e.message) + '<br><small style="opacity:0.7">Cek link-nya (harus video publik), lalu coba lagi.</small>');
  }

  $('loadWrap').classList.remove('visible');
  btn.disabled = false;
}

/* ---------- events ---------- */
document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => { setPlatform(t.dataset.p); resetUI(); }));

$('gobtn').addEventListener('click', doFetch);
$('vurl').addEventListener('keydown', e => { if (e.key === 'Enter') doFetch(); });

$('pasteBtn').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    $('vurl').value = t.trim();
    const p = detectPlatform(t);
    if (p) setPlatform(p);
  } catch (_) {
    $('vurl').focus();
  }
});

$('vurl').addEventListener('input', e => {
  const p = detectPlatform(e.target.value);
  if (p && p !== platform) setPlatform(p);
});

/* ---------- PWA: service worker + install ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

let deferredPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const dismissed = (() => { try { return localStorage.getItem('viddown-install-x'); } catch (_) { return null; } })();

function showInstall() {
  if (!isStandalone && !dismissed) $('installBanner').classList.add('visible');
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstall();
});

window.addEventListener('appinstalled', () => $('installBanner').classList.remove('visible'));

$('installGo').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    $('installBanner').classList.remove('visible');
  }
});

$('installX').addEventListener('click', () => {
  $('installBanner').classList.remove('visible');
  try { localStorage.setItem('viddown-install-x', '1'); } catch (_) {}
});

/* iOS tidak punya prompt install, jadi tampilkan petunjuk manual */
if (isIOS) {
  $('installText').innerHTML = '<strong>Install ke iPhone</strong><br>Tekan tombol Share, lalu pilih <b>Add to Home Screen</b>';
  $('installGo').style.display = 'none';
  showInstall();
}
</script>
</body>
</html>
